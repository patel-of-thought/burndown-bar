<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BurndownBar preview</title>
  <style>
    html, body { margin: 0; background: #05060f; }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: radial-gradient(120% 90% at 78% 12%, #17224e 0%, #0b1029 46%, #05060f 100%);
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .neb {
      position: absolute;
      border-radius: 50%;
    }
    .neb-a {
      right: -8%;
      top: -28%;
      width: 720px;
      height: 720px;
      background: radial-gradient(closest-side, rgba(94, 92, 230, 0.28), rgba(94, 92, 230, 0));
    }
    .neb-b {
      left: -12%;
      bottom: -30%;
      width: 640px;
      height: 640px;
      background: radial-gradient(closest-side, rgba(10, 132, 255, 0.18), rgba(10, 132, 255, 0));
    }
    .field {
      position: absolute;
      left: -8%;
      top: -22%;
      width: 128%;
      height: auto;
    }
    .scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(5, 6, 15, 0.62) 0%, rgba(5, 6, 15, 0.18) 58%, rgba(5, 6, 15, 0.08) 100%);
    }
    .content {
      position: absolute;
      left: 84px;
      right: 84px;
      bottom: 76px;
    }
    .icon {
      width: 92px;
      height: 92px;
      filter: drop-shadow(0 16px 28px rgba(0, 0, 0, 0.45));
    }
    h1 {
      margin: 28px 0 0;
      font-size: 76px;
      font-weight: 650;
      letter-spacing: -0.035em;
      line-height: 1;
    }
    .catch {
      margin: 16px 0 0;
      font-size: 32px;
      font-weight: 500;
      letter-spacing: -0.025em;
      line-height: 1.2;
      color: rgba(245, 245, 247, 0.92);
    }
    .sub {
      margin: 10px 0 0;
      font-size: 24px;
      letter-spacing: -0.02em;
      color: rgba(245, 245, 247, 0.68);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="neb neb-a"></div>
    <div class="neb neb-b"></div>
    <img class="field" src="images/constellation.svg" alt="">
    <div class="scrim"></div>
    <div class="content">
      <img class="icon" src="images/app-icon.png" alt="">
      <h1>BurndownBar</h1>
      <p class="catch">May you not Burndown your AI tokens</p>
      <p class="sub">AI quotas, in the macOS menu bar</p>
    </div>
  </div>
</body>
</html>
